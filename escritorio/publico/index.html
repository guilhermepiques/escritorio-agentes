<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26242d">
  <title>Escritório</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2326242d'/%3E%3Crect x='2' y='4' width='12' height='9' fill='%23efeae2'/%3E%3Crect x='4' y='6' width='3' height='3' fill='%238fc8ec'/%3E%3Crect x='9' y='6' width='3' height='3' fill='%238fc8ec'/%3E%3Crect x='7' y='10' width='2' height='3' fill='%235b3a29'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <canvas id="escritorio" aria-label="Escritório visual com os agentes trabalhando ao vivo. Clique em alguém para ver a ficha."></canvas>
  </main>
  <div class="hud" aria-live="polite">
    <span id="conexao" class="off">conectando…</span>
    <span id="hora"></span>
    <button id="ultimo" type="button" hidden title="Abrir o mural"></button>
  </div>

  <nav class="barra" aria-label="Painéis">
    <button id="bt-falta" type="button" data-painel="falta" aria-controls="painel" aria-expanded="false">Falta você <span class="cont" id="cont-falta">0</span></button>
    <button type="button" data-painel="videos" aria-controls="painel" aria-expanded="false">Vídeos</button>
    <button type="button" data-painel="mural" aria-controls="painel" aria-expanded="false">Mural <span class="cont novo" id="cont-mural" hidden>0</span></button>
    <button id="bt-som" type="button" class="som" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sino" d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0"/><path class="risco" d="M4 4l16 16"/></svg>
    </button>
  </nav>

  <aside id="painel" class="painel" hidden aria-labelledby="painel-titulo">
    <header>
      <button id="painel-voltar" type="button" class="voltar" hidden aria-label="Voltar">‹</button>
      <h2 id="painel-titulo" tabindex="-1"></h2>
      <button id="painel-fechar" type="button" class="fechar" aria-label="Fechar painel">×</button>
    </header>
    <div id="painel-corpo"></div>
  </aside>

  <p id="carregando">Abrindo o escritório…</p>
  <script type="module" src="js/app.js"></script>
</body>
</html>
