<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório visual: 3 plantas para escolher</title>
<style>
  body { margin: 0; background: #17151c; color: #ece8f2; font-family: system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: #a9a3b6; margin: 0 0 28px; line-height: 1.5; }
  section { margin-bottom: 44px; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  section p { color: #a9a3b6; margin: 0 0 12px; line-height: 1.5; }
  canvas { width: 100%; height: auto; image-rendering: pixelated; border-radius: 8px; display: block; }
</style>
</head>
<body>
<main>
  <h1>Escritório visual: 3 plantas</h1>
  <p class="sub">Esboço de onde fica cada sala e cada móvel, visto de cima. A arte final ganha mais detalhe e animação.
    A Samanta está na copa jogando videogame só para mostrar como fica alguém livre.</p>
  <div id="versoes"></div>
</main>
<script>
// Esboço das plantas do escritório. Tudo é desenhado em código, retângulo por retângulo (sem imagens de terceiros).
const T = 16;      // tamanho de um bloco, em pixels de arte
const S = 3;       // cada pixel de arte vira S pixels na tela
const PAREDE = 4;  // espessura da parede vista de cima
const FACE = 28;   // altura da parede do fundo de cada sala
let ctx;
let etiquetas = [];

function R(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function sorte(semente) {
  let s = Math.max(1, Math.floor(semente) % 2147483647);
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}
function texto(t, x, y, tam, cor, peso = 'bold') {
  ctx.font = `${peso} ${tam}px system-ui, "Segoe UI", sans-serif`;
  ctx.fillStyle = cor;
  ctx.textBaseline = 'top';
  ctx.fillText(t, x, y);
}
function larguraTexto(t, tam) {
  ctx.font = `bold ${tam}px system-ui, "Segoe UI", sans-serif`;
  return ctx.measureText(t).width;
}

// ---------- pisos ----------
function pisoConcreto(x, y, w, h, base = '#d6d0c6') {
  R(x, y, w, h, base);
  const r = sorte(x * 31 + y * 17 + 7);
  for (let i = 0; i < (w * h) / 70; i++)
    R(x + Math.floor(r() * w), y + Math.floor(r() * h), 1, 1, r() < 0.5 ? '#cbc4b9' : '#e2ddd5');
}
function pisoMadeira(x, y, w, h, base, linha) {
  R(x, y, w, h, base);
  for (let yy = y, n = 0; yy < y + h; yy += 5, n++) {
    R(x, yy, w, 1, linha);
    for (let xx = x + ((n * 13) % 37); xx < x + w; xx += 37) R(xx, yy, 1, Math.min(5, y + h - yy), linha);
  }
}
function pisoXadrez(x, y, w, h, a, b, t) {
  for (let yy = 0; yy < h; yy += t)
    for (let xx = 0; xx < w; xx += t)
      R(x + xx, y + yy, Math.min(t, w - xx), Math.min(t, h - yy), (Math.floor(xx / t) + Math.floor(yy / t)) % 2 ? a : b);
}
function pisoGrade(x, y, w, h, base, linha, t) {
  R(x, y, w, h, base);
  for (let xx = x; xx < x + w; xx += t) R(xx, y, 1, h, linha);
  for (let yy = y; yy < y + h; yy += t) R(x, yy, w, 1, linha);
}

const ESTILO = {
  gerente:     { piso: (x, y, w, h) => pisoMadeira(x, y, w, h, '#6b4a35', '#5a3d2b'), parede: '#33415a', rodape: '#232d40' },
  estudio:     { piso: (x, y, w, h) => pisoGrade(x, y, w, h, '#24222e', '#2e2b3c', 16), parede: '#2a2638', rodape: '#1c1a26' },
  crescimento: { piso: (x, y, w, h) => pisoXadrez(x, y, w, h, '#c9d1dc', '#bec7d3', 16), parede: '#e6ebef', rodape: '#c2c9d0' },
  copa:        { piso: (x, y, w, h) => pisoXadrez(x, y, w, h, '#f1e4cc', '#e3d0b0', 8), parede: '#cfe6d8', rodape: '#a9c8b5' },
  produtos:    { piso: (x, y, w, h) => pisoConcreto(x, y, w, h, '#e3ded5'), parede: '#dcd6cc', rodape: '#bfb8ac' },
};

// ---------- gente ----------
const AG = {
  gerson:  { nome: 'Gerson',  camisa: '#868E96', cabelo: '#cfd3d8', pele: '#e8b896' },
  carla:   { nome: 'Carla',   camisa: '#E8590C', cabelo: '#6b2f17', pele: '#f1c7a3' },
  roberto: { nome: 'Roberto', camisa: '#4263EB', cabelo: '#2b2430', pele: '#c68b62' },
  samanta: { nome: 'Samanta', camisa: '#D6336C', cabelo: '#e0a84a', pele: '#f3cfb0' },
  renata:  { nome: 'Renata',  camisa: '#2F9E44', cabelo: '#3b2418', pele: '#8d5a3b' },
  edu:     { nome: 'Edu',     camisa: '#F59F00', cabelo: '#1f1a1a', pele: '#d9a27a' },
};
function sentadoCostas(x, y, a) { // tronco visto de trás, 12x15
  R(x + 2, y, 8, 9, a.cabelo); R(x + 1, y + 1, 1, 6, a.cabelo); R(x + 10, y + 1, 1, 6, a.cabelo);
  R(x + 1, y + 5, 1, 2, a.pele); R(x + 10, y + 5, 1, 2, a.pele);
  R(x + 1, y + 9, 10, 6, a.camisa); R(x, y + 10, 1, 4, a.camisa); R(x + 11, y + 10, 1, 4, a.camisa);
  R(x + 1, y + 9, 10, 1, 'rgba(255,255,255,.25)');
}
function sentadoFrente(x, y, a, gravata) { // tronco de frente, 12x17
  R(x + 2, y + 1, 8, 8, a.pele); R(x + 2, y, 8, 3, a.cabelo); R(x + 1, y + 1, 1, 5, a.cabelo); R(x + 10, y + 1, 1, 5, a.cabelo);
  R(x + 4, y + 5, 1, 2, '#2b2430'); R(x + 7, y + 5, 1, 2, '#2b2430'); R(x + 5, y + 8, 2, 1, '#b5735f');
  R(x + 1, y + 9, 10, 8, a.camisa); R(x, y + 10, 1, 6, a.camisa); R(x + 11, y + 10, 1, 6, a.camisa);
  if (gravata) { R(x + 4, y + 9, 4, 3, '#f1f3f5'); R(x + 5, y + 10, 2, 6, '#9c2a2a'); }
}
function etiqueta(cx, y, a) { etiquetas.push([cx, y, a]); }
function desenharEtiquetas() {
  for (const [cx, y, a] of etiquetas) {
    const w = Math.ceil(larguraTexto(a.nome, 5)) + 5;
    R(cx - w / 2, y, w, 8, 'rgba(20,18,26,.88)'); R(cx - w / 2, y + 8, w, 1, a.camisa);
    texto(a.nome, cx - w / 2 + 2.5, y + 1.3, 5, '#ffffff');
  }
  etiquetas = [];
}

// ---------- móveis gerais ----------
function planta(x, y) { // 12x18
  R(x + 1, y + 4, 10, 8, '#3f8f4a'); R(x + 3, y + 1, 6, 4, '#4fae5b'); R(x, y + 6, 2, 4, '#2f6f3a'); R(x + 10, y + 6, 2, 4, '#2f6f3a');
  R(x + 3, y + 5, 2, 2, '#6cc777'); R(x + 7, y + 7, 2, 2, '#6cc777'); R(x + 5, y + 2, 2, 2, '#7fd88a');
  R(x + 2, y + 11, 8, 2, '#8c4a28'); R(x + 3, y + 13, 6, 5, '#b5653a'); R(x + 3, y + 13, 6, 1, '#d27d4b');
}
function plantaGrande(x, y) { // 16x26
  R(x + 2, y + 4, 12, 12, '#2f7a3c'); R(x + 4, y, 8, 6, '#3f9a4c'); R(x, y + 8, 4, 6, '#276633'); R(x + 12, y + 8, 4, 6, '#276633');
  R(x + 5, y + 5, 3, 3, '#5fc06c'); R(x + 9, y + 9, 3, 3, '#5fc06c');
  R(x + 3, y + 16, 10, 2, '#2b2430'); R(x + 4, y + 18, 8, 8, '#4a4450'); R(x + 4, y + 18, 8, 1, '#6a6470');
}
function janela(x, y, w, h) {
  R(x, y, w, h, '#f4f1ea'); R(x + 2, y + 2, w - 4, h - 4, '#9fd4ee');
  R(x + 2, y + 2 + Math.floor((h - 4) / 2), w - 4, 1, '#f4f1ea'); R(x + Math.floor(w / 2), y + 2, 1, h - 4, '#f4f1ea');
  R(x + 4, y + 4, 3, 1, '#d8f0fb'); R(x + 4, y + 5, 1, 2, '#d8f0fb'); R(x, y + h, w, 2, '#cfc8bc');
}
function janelaCidade(x, y, w, h) {
  R(x, y, w, h, '#1d2433'); R(x + 1, y + 1, w - 2, h - 2, '#f2b880'); R(x + 1, y + 1, w - 2, Math.floor(h / 2), '#8fb8e0');
  const r = sorte(x * 13 + 5);
  let xx = x + 1;
  while (xx < x + w - 1) {
    const bw = Math.min(4 + Math.floor(r() * 7), x + w - 1 - xx), bh = 5 + Math.floor(r() * (h - 7));
    R(xx, y + h - 1 - bh, bw, bh, '#4b5f86');
    for (let k = 2; k < bh - 1; k += 3) for (let j = 1; j < bw - 1; j += 2) if (r() < 0.45) R(xx + j, y + h - 1 - bh + k, 1, 1, '#ffe08a');
    xx += bw + 1;
  }
  for (let i = 1; i < 4; i++) R(x + Math.floor((w * i) / 4), y + 1, 1, h - 2, '#1d2433');
  R(x, y + h, w, 2, '#c9a24a');
}
function quadroBranco(x, y, w, h) {
  R(x, y, w, h, '#9aa1a9'); R(x + 1, y + 1, w - 2, h - 2, '#fbfbfc');
  const cs = ['#ffd43b', '#ff8fab', '#74c0fc', '#8ce99a'];
  for (let i = 0; i < 6; i++) R(x + 4 + (i % 3) * 7, y + 3 + Math.floor(i / 3) * 6, 5, 4, cs[i % 4]);
  R(x + w - 20, y + 4, 14, 1, '#4263eb'); R(x + w - 20, y + 7, 9, 1, '#e8590c'); R(x + w - 20, y + 10, 12, 1, '#2f9e44');
  R(x + 2, y + h, w - 4, 2, '#7d848c');
}
function relogio(x, y) {
  R(x + 1, y, 6, 8, '#2b2430'); R(x, y + 1, 8, 6, '#2b2430'); R(x + 1, y + 1, 6, 6, '#f8f8f8');
  R(x + 4, y + 2, 1, 2, '#2b2430'); R(x + 4, y + 4, 2, 1, '#2b2430');
}
function cadeira(x, y, c) { // encosto visto de trás, 14x12
  R(x + 1, y, 12, 8, c); R(x + 1, y, 12, 1, 'rgba(255,255,255,.25)'); R(x, y + 1, 1, 6, c); R(x + 13, y + 1, 1, 6, c);
  R(x + 6, y + 8, 2, 2, '#2b2430'); R(x + 2, y + 10, 10, 1, '#2b2430'); R(x + 2, y + 11, 1, 1, '#2b2430'); R(x + 11, y + 11, 1, 1, '#2b2430');
}
function bebedouro(x, y) { // 12x22
  R(x + 2, y, 8, 8, '#a5d8ff'); R(x + 3, y + 1, 2, 4, '#d0ebff');
  R(x + 1, y + 8, 10, 14, '#e9ecef'); R(x + 1, y + 8, 10, 1, '#ced4da'); R(x + 3, y + 11, 2, 1, '#1c7ed6'); R(x + 7, y + 11, 2, 1, '#e03131');
}
function impressora(x, y) { R(x, y + 4, 18, 10, '#dee2e6'); R(x, y + 4, 18, 1, '#f1f3f5'); R(x + 3, y, 12, 5, '#f8f9fa'); R(x + 3, y + 9, 12, 2, '#495057'); R(x + 14, y + 6, 2, 1, '#40c057'); R(x + 1, y + 14, 16, 6, '#adb5bd'); }

// ---------- telas de cada cargo ----------
const TELAS = {
  carla:   (x, y, w, h) => { R(x, y, w, h, '#101018'); ['#ff6b6b', '#ffd43b', '#4dabf7'].forEach((c, i) => { R(x + 1 + i * 6, y + 1, 5, h - 2, c); R(x + 2 + i * 6, y + 3, 3, 2, '#fff'); }); },
  roberto: (x, y, w, h) => { R(x, y, w, h, '#f8f9fa'); for (let i = 0; i < 4; i++) R(x + 2, y + 2 + i * 2, w - 4 - (i % 2) * 5, 1, '#495057'); },
  samanta: (x, y, w, h) => { R(x, y, w, h, '#ffdeeb'); R(x + 2, y + 2, 5, 7, '#d6336c'); R(x + 3, y + 3, 3, 4, '#fff'); R(x + 9, y + 3, 1, 6, '#d6336c'); R(x + 12, y + 3, 1, 6, '#d6336c'); R(x + 8, y + 4, 6, 1, '#d6336c'); R(x + 8, y + 7, 6, 1, '#d6336c'); },
  renata:  (x, y, w, h) => { R(x, y, w, h, '#ebfbee'); for (let i = 0; i < 3; i++) { R(x + 2, y + 2 + i * 3, 2, 2, i === 1 ? '#e03131' : '#2f9e44'); R(x + 6, y + 2 + i * 3, w - 8, 1, '#868e96'); } },
  edu:     (x, y, w, h) => { R(x, y, w, h, '#15131c'); R(x + 2, y + 1, w - 4, h - 6, '#4dabf7'); R(x + 4, y + 3, 4, 3, '#ffd43b'); R(x + 1, y + h - 4, w - 2, 1, '#7950f2'); R(x + 2, y + h - 3, 7, 2, '#9775fa'); R(x + 10, y + h - 3, Math.max(2, w - 12), 2, '#20c997'); },
  painel:  (x, y, w, h) => { R(x, y, w, h, '#121a24'); const n = 6, bw = Math.floor((w - 4) / n); [3, 6, 4, 8, 9, 12].forEach((v, i) => { v = Math.min(v, h - 3); R(x + 2 + i * bw, y + h - 1 - v, bw - 1, v, i === n - 1 ? '#40c057' : '#339af0'); }); R(x + 2, y + 2, 10, 1, '#ced4da'); },
};
function mesaTrabalho(x, y, w, tela) { // y = topo do tampo
  R(x, y, w, 10, '#c8976a'); R(x, y, w, 1, '#e0b68a'); R(x, y + 10, w, 6, '#8b5e3c'); R(x, y + 10, w, 1, '#6f4a2f');
  R(x + 1, y + 16, 2, 4, '#5a3b27'); R(x + w - 3, y + 16, 2, 4, '#5a3b27');
  const mx = Math.round(x + w / 2 - 10);
  R(mx, y - 12, 20, 14, '#2b2430'); tela(mx + 1, y - 11, 18, 11); R(mx + 8, y + 2, 4, 2, '#2b2430');
  R(x + w / 2 - 6, y + 5, 12, 3, '#eceef2'); R(x + w / 2 + 8, y + 5, 3, 4, '#eceef2');
  R(x + 3, y + 3, 4, 5, '#f1e6c8');
}
function posto(x, y, w, tela, a, ocupado = true) { // mesa + pessoa de costas + cadeira
  mesaTrabalho(x, y, w, tela);
  const px = Math.round(x + w / 2 - 6);
  if (ocupado) { sentadoCostas(px, y + 9, a); etiqueta(x + w / 2, y - 23, a); }
  cadeira(px - 1, y + 17, '#3b3f4e');
}

// ---------- sala do gerente ----------
function estante(x, y, w, h) {
  R(x, y, w, h, '#5b3a29'); R(x + 2, y + 2, w - 4, h - 4, '#3e271b');
  const r = sorte(x * 7 + y), cs = ['#c92a2a', '#1971c2', '#e8590c', '#2f9e44', '#f08c00', '#862e9c', '#f1f3f5'];
  for (let sy = y + 2; sy < y + h - 6; sy += 9) {
    let bx = x + 3;
    while (bx < x + w - 4) { const bw = Math.min(2 + Math.floor(r() * 2), x + w - 3 - bx), bh = 5 + Math.floor(r() * 3); R(bx, sy + 8 - bh, bw, bh, cs[Math.floor(r() * cs.length)]); bx += bw + (r() < 0.2 ? 2 : 0); }
    R(x + 2, sy + 8, w - 4, 1, '#5b3a29');
  }
}
function prateleiraTrofeus(x, y) {
  R(x, y + 10, 24, 2, '#c9a24a');
  R(x + 3, y + 2, 6, 4, '#f2c94c'); R(x + 5, y + 6, 2, 2, '#c9a24a'); R(x + 4, y + 8, 4, 2, '#8a6d2c');
  R(x + 13, y + 3, 8, 7, '#1d2433'); R(x + 14, y + 4, 6, 5, '#f2b880');
}
function tapete(x, y, w, h, borda, meio, detalhe) {
  R(x, y, w, h, borda); R(x + 3, y + 3, w - 6, h - 6, meio); R(x + 5, y + 5, w - 10, h - 10, borda); R(x + 6, y + 6, w - 12, h - 12, meio);
  const cx = Math.round(x + w / 2), cy = Math.round(y + h / 2);
  for (let i = 0; i < 7; i++) { R(cx - i * 2 - 1, cy - 7 + i, i * 4 + 2, 1, detalhe); R(cx - i * 2 - 1, cy + 7 - i, i * 4 + 2, 1, detalhe); }
}
function mesaExecutiva(x, y, w, a) {
  const cx = Math.round(x + w / 2);
  R(cx - 9, y - 24, 18, 22, '#1f1c24'); R(cx - 8, y - 23, 16, 20, '#2c2833'); R(cx - 8, y - 23, 16, 1, '#4a4555');
  sentadoFrente(cx - 6, y - 16, a, true); etiqueta(cx, y - 35, a);
  R(x, y, w, 12, '#5b3a29'); R(x, y, w, 1, '#7a5039'); R(x, y + 12, w, 9, '#40281c'); R(x, y + 13, w, 1, '#c9a24a');
  R(x + 2, y + 21, 3, 3, '#2b1b13'); R(x + w - 5, y + 21, 3, 3, '#2b1b13');
  R(cx - 7, y + 2, 14, 7, '#c9ced6'); R(cx - 6, y + 3, 12, 5, '#4dabf7'); R(cx - 7, y + 9, 14, 2, '#adb5bd');
  R(x + 4, y - 6, 7, 3, '#c9a24a'); R(x + 6, y - 3, 2, 6, '#8a6d2c'); R(x + 4, y + 3, 6, 2, '#8a6d2c');
  R(x + w - 15, y + 3, 8, 6, '#f8f9fa'); R(x + w - 14, y + 4, 6, 1, '#adb5bd'); R(x + w - 6, y + 3, 3, 4, '#e9ecef');
}
function poltronaCostas(x, y, c, esc) { R(x, y, 16, 12, esc); R(x + 1, y + 1, 14, 9, c); R(x + 1, y + 1, 14, 1, 'rgba(255,255,255,.2)'); R(x - 1, y + 4, 3, 9, esc); R(x + 14, y + 4, 3, 9, esc); }
function sofaCostas(x, y, w, c, esc) {
  R(x, y, w, 14, esc); R(x + 1, y + 1, w - 2, 10, c); R(x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,.2)');
  R(x - 3, y + 4, 4, 12, esc); R(x + w - 1, y + 4, 4, 12, esc);
  for (let i = 1; i < 3; i++) R(x + Math.round((w * i) / 3), y + 2, 1, 8, esc);
}
function mesaCentro(x, y, w, h) { R(x, y, w, h, '#1d2433'); R(x + 1, y + 1, w - 2, h - 3, '#bfe3ee'); R(x + 3, y + 2, 5, 1, '#ffffff'); R(x + w - 10, y + 3, 4, 3, '#c9a24a'); }
function luminaria(x, y) { R(x, y, 10, 6, '#f2e3b3'); R(x + 1, y + 6, 8, 1, '#c9a24a'); R(x + 4, y + 7, 2, 16, '#2b2430'); R(x + 1, y + 23, 8, 2, '#2b2430'); }
function minibar(x, y) {
  R(x, y, 22, 16, '#40281c'); R(x, y, 22, 2, '#7a5039'); R(x + 2, y + 5, 8, 9, '#2b1b13'); R(x + 12, y + 5, 8, 9, '#2b1b13'); R(x + 9, y + 9, 1, 2, '#c9a24a'); R(x + 12, y + 9, 1, 2, '#c9a24a');
  R(x + 3, y - 7, 2, 7, '#2f9e44'); R(x + 7, y - 6, 2, 6, '#c92a2a'); R(x + 11, y - 8, 2, 8, '#f08c00'); R(x + 15, y - 3, 4, 3, '#dee2e6');
}
function mesaReuniao(x, y, w) {
  for (let i = 0; i < 3; i++) { cadeiraPequena(x + 8 + i * Math.floor((w - 24) / 2), y - 9, '#1f1c24'); }
  R(x, y, w, 16, '#2b1b13'); R(x + 2, y + 1, w - 4, 13, '#6b4a35'); R(x + 2, y + 1, w - 4, 1, '#8a6247'); R(x + w / 2 - 6, y + 5, 12, 5, '#c9a24a');
  for (let i = 0; i < 3; i++) { cadeiraPequena(x + 8 + i * Math.floor((w - 24) / 2), y + 17, '#1f1c24'); }
}
function cadeiraPequena(x, y, c) { R(x, y, 9, 8, c); R(x + 1, y + 1, 7, 1, 'rgba(255,255,255,.2)'); }
function mobiliarGerente(b) {
  const cx = Math.round(b.ix + b.iw / 2);
  estante(b.ix + 4, b.fy - 22, 26, 30);
  const jw = Math.min(150, b.iw - 76);
  janelaCidade(cx - Math.floor(jw / 2), b.iy + 3, jw, 18);
  prateleiraTrofeus(b.ix + b.iw - 30, b.iy + 3);
  plantaGrande(b.ix + b.iw - 20, b.fy - 10);
  tapete(cx - 46, b.fy + 8, 92, 58, '#c9a24a', '#7a2e3a', '#e0c27a');
  mesaExecutiva(cx - 32, b.fy + 26, 64, AG.gerson);
  poltronaCostas(cx - 26, b.fy + 52, '#2f6f73', '#1f4f52'); poltronaCostas(cx + 10, b.fy + 52, '#2f6f73', '#1f4f52');
  if (b.fh > 230) mesaReuniao(cx - 36, b.fy + 120, 72);
  if (b.fh > 110) {

// ---------- salas, paredes e portas ----------
function prepararSala(s) {
  const X = s.x * T, Y = s.y * T, W = s.w * T, H = s.h * T;
  const ix = X + PAREDE, iy = Y + PAREDE, iw = W - 2 * PAREDE, ih = H - 2 * PAREDE, fy = iy + FACE;
  s.box = { X, Y, W, H, ix, iy, iw, ih, fy, fh: iy + ih - fy };
  const e = ESTILO[s.tipo];
  e.piso(ix, fy, iw, s.box.fh);
  R(ix, iy, iw, FACE, e.parede); R(ix, iy + FACE - 3, iw, 3, e.rodape); R(ix, iy, iw, 1, 'rgba(255,255,255,.18)');
  R(ix, fy, iw, 2, 'rgba(0,0,0,.14)');
}
function paredes(s) {
  const { X, Y, W, H } = s.box;
  const lados = { top: [X, Y, W, PAREDE], bottom: [X, Y + H - PAREDE, W, PAREDE], left: [X, Y, PAREDE, H], right: [X + W - PAREDE, Y, PAREDE, H] };
  for (const lado in lados) {
    const [x, y, w, h] = lados[lado];
    if (s.vidro && s.vidro.includes(lado)) {
      R(x, y, w, h, '#7fc4dd');
      if (w > h) for (let i = 2; i < w; i += 7) R(x + i, y + 1, 2, 1, '#e3f6fc'); else for (let i = 2; i < h; i += 7) R(x + 1, y + i, 1, 2, '#e3f6fc');
    } else {
      R(x, y, w, h, '#ece7df');
      if (w > h) R(x, y + h - 1, w, 1, '#b9b1a4'); else R(lado === 'left' ? x + w - 1 : x, y, 1, h, '#b9b1a4');
    }
  }
  for (const p of s.portas || []) {
    const len = 2 * T;
    if (p.lado === 'bottom') { R(X + p.em * T, Y + H - PAREDE, len, PAREDE, '#b8a88f'); }
    if (p.lado === 'left')   { R(X, Y + p.em * T, PAREDE, len, '#b8a88f'); }
    if (p.lado === 'right')  { R(X + W - PAREDE, Y + p.em * T, PAREDE, len, '#b8a88f'); }
    if (p.lado === 'top')    { ESTILO[s.tipo].piso(X + p.em * T, Y, len, PAREDE + FACE); R(X + p.em * T - 2, Y + PAREDE, 2, FACE, '#8d7f6c'); R(X + p.em * T + len, Y + PAREDE, 2, FACE, '#8d7f6c'); }
  }
}
function rotulo(s) {
  const nome = s.nome, w = larguraTexto(nome, 6.5) + 10;
  const x = s.box.X + s.box.W / 2 - w / 2, y = s.box.Y - 5;
  R(x, y, w, 11, '#17151c'); R(x + 1, y + 1, w - 2, 9, s.tipo === 'produtos' ? '#868e96' : '#f8f4ec');
  texto(nome, x + 5, y + 2, 6.5, s.tipo === 'produtos' ? '#f8f9fa' : '#2b2430');
}
const MOBILIA = { gerente: mobiliarGerente, estudio: mobiliarEstudio, crescimento: mobiliarCrescimento, copa: mobiliarCopa, produtos: mobiliarProdutos };

function desenhar(canvas, L) {
  const W = L.w * T, H = L.h * T;
  canvas.width = W * S; canvas.height = H * S;
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  R(0, 0, W, H, '#3a3644');
  pisoConcreto(6, 6, W - 12, H - 12);
  const ent = L.entrada;
  if (ent.lado === 'bottom') { pisoConcreto(ent.em * T, H - 6, 2 * T, 6); R(ent.em * T + 2, H - 14, 2 * T - 4, 8, '#7a4a2a'); R(ent.em * T + 4, H - 12, 2 * T - 8, 4, '#8f5a35'); }
  if (ent.lado === 'left') { pisoConcreto(0, ent.em * T, 6, 2 * T); R(6, ent.em * T + 2, 8, 2 * T - 4, '#7a4a2a'); R(8, ent.em * T + 4, 4, 2 * T - 8, '#8f5a35'); }
  for (const s of L.salas) prepararSala(s);
  for (const s of L.salas) MOBILIA[s.tipo](s.box, L.livres || []);
  for (const s of L.salas) paredes(s);
  for (const [f, x, y] of L.extras || []) f(x * T, y * T);
  for (const s of L.salas) rotulo(s);
  desenharEtiquetas();
}
